# OOWiki site configuration / OOWiki 站点配置
# Purpose / 用途: MkDocs Material navigation, rendering and search configuration.
# Reload / 重载: rerun `python -m mkdocs build --clean --strict`; Pages changes require an approved deployment.
# Risk / 风险: navigation paths must exist; Python/YAML tags below are trusted build input. Never place secrets here.
# Author / 作者: zkonikishi
# QQ: 276098266
# Discord: https://discord.gg/KPq2fZHFK
# ifdian: https://ifdian.net/a/zkonikishi
# QQ Group / QQ群: 1063369777
site_name: OO 系列插件 Wiki
site_description: Meowopia OO 系列 Minecraft 插件统一中文文档
site_url: https://wiki.meowopia.com/
repo_url: https://github.com/Meowopia/OOWiki
repo_name: Meowopia/OOWiki
edit_uri: edit/main/docs/

# Documentation source / 文档源目录 (relative path; default: docs)
docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

# Navigation tree / 导航树 (ordered mapping; paths must exist under docs_dir)
nav:
  - 首页: index.md
  - 文档:
      - OO 生态愿景: vision.md
      - 安装与升级: installation.md
      - 架构与依赖: architecture.md
      - 配置参考: configuration.md
      - 命令与权限: commands-permissions.md
      - 集成边界: integration.md
      - 迁移规则: migration.md
      - 安全模型: security.md
  - 插件: plugins/index.md
  - 开发:
      - 开发者接入: development.md
      - 开源与仓库边界: source-policy.md
      - 故障排查: troubleshooting.md
      - 发布流程: release.md
      - 验收清单: acceptance.md
      - Pages 预览与回滚: pages-runbook.md

# Markdown features / Markdown 功能 (list; changes affect rendered HTML)
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

# Build plugins / 构建插件 (list; search indexes zh/en content)
plugins:
  - search:
      lang:
        - zh
        - en

# Global custom styles / 全局自定义样式 (paths relative to docs_dir)
extra_css:
  - stylesheets/extra.css
  - stylesheets/redesign.css

# Client-side layout helpers / 客户端布局辅助脚本
extra_javascript:
  - javascripts/plugin-page-layout.js

copyright: Copyright &copy; 2026 Meowopia
