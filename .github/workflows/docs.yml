name: Docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  strict-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m mkdocs build --clean --strict
