name: 文档问题
description: 报告错误、断链、过期状态或缺失内容
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: 页面
      placeholder: docs/architecture.md 或页面 URL
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 说明当前内容、预期内容及状态错误。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 提供源码、artifact、测试或发布记录；请勿提交敏感信息。
